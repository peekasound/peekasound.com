name: Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check static site
        run: node scripts/check-static-site.mjs
